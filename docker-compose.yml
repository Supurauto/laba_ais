services:
  consul:
    image: hashicorp/consul:1.20
    container_name: consul
    ports:
      - "8500:8500"
    healthcheck:
      test: [ "CMD", "consul", "members" ]
      interval: 5s
      timeout: 3s
      retries: 5

  catalog-1:
    build: ./catalog_service
    container_name: catalog-1
    environment:
      INSTANCE_NAME: catalog-1
      PORT: 8000
      CONSUL_URL: http://consul:8500
    depends_on:
      consul:
        condition: service_healthy
    volumes:
      - catalog_data:/data

  catalog-2:
    build: ./catalog_service
    container_name: catalog-2
    environment:
      INSTANCE_NAME: catalog-2
      PORT: 8000
      CONSUL_URL: http://consul:8500
    depends_on:
      consul:
        condition: service_healthy
    volumes:
      - catalog_data:/data

  auth:
    build: ./auth_service
    container_name: auth
    environment:
      PORT: 8000
      CONSUL_URL: http://consul:8500
      JWT_SECRET: ${JWT_SECRET:?Укажите JWT_SECRET в .env}
    volumes:
      - auth_data:/data
    depends_on:
      consul:
        condition: service_healthy

  kafka:
    image: apache/kafka:3.9.1
    hostname: kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test:
        - CMD-SHELL
        - /opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  kafka-init:
    image: apache/kafka:3.9.1
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: [ "/bin/sh", "-c" ]
    command:
      - |
        set -e
        /opt/kafka/bin/kafka-topics.sh \
          --bootstrap-server kafka:9092 \
          --create \
          --if-not-exists \
          --topic orders-events \
          --partitions 1 \
          --replication-factor 1 \
          --config retention.ms=-1

        /opt/kafka/bin/kafka-topics.sh \
          --bootstrap-server kafka:9092 \
          --create \
          --if-not-exists \
          --topic payment-results \
          --partitions 1 \
          --replication-factor 1 \
          --config retention.ms=-1

        /opt/kafka/bin/kafka-topics.sh \
          --bootstrap-server kafka:9092 \
          --list

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    ports:
      - "127.0.0.1:18081:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: bookstore
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    depends_on:
      kafka:
        condition: service_healthy

  order:
    build:
      context: .
      dockerfile: order_service/Dockerfile
    container_name: order
    environment:
      KAFKA_ADDRESS: kafka:9092
      PAYMENT_GRPC_ADDRESS: payment:50051
    volumes:
      - order_data:/data
    depends_on:
      kafka-init:
        condition: service_completed_successfully

  payment:
    build:
      context: .
      dockerfile: payment_service/Dockerfile
    environment:
      KAFKA_ADDRESS: kafka:9092
    depends_on:
      kafka-init:
        condition: service_completed_successfully

  notification:
    build:
      context: .
      dockerfile: notification_service/Dockerfile
    environment:
      KAFKA_ADDRESS: kafka:9092
    volumes:
      - notification_data:/data
    depends_on:
      kafka-init:
        condition: service_completed_successfully

  analytics:
    build:
      context: .
      dockerfile: analytics_service/Dockerfile
    environment:
      KAFKA_ADDRESS: kafka:9092
    volumes:
      - analytics_data:/data
    depends_on:
      kafka-init:
        condition: service_completed_successfully

  graphql:
    build: ./graphql_gateway
    container_name: graphql
    environment:
      ORDER_URL: http://order:8000
      CATALOG_URL: http://catalog-1:8000
    depends_on:
      - order
      - catalog-1
  nginx:
    image: nginx:1.27
    container_name: nginx
    ports:
      - "127.0.0.1:80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api-gateway
      - catalog-1
      - catalog-2

  api-gateway:
    build: ./api_gateway
    environment:
      JWT_SECRET: ${JWT_SECRET:?Укажите JWT_SECRET в .env}
    depends_on:
      - auth
      - order
      - analytics
      - graphql
      - catalog-1
      - catalog-2
volumes:
  order_data:
  kafka_data:
  notification_data:
  analytics_data:
  auth_data:
  catalog_data:

