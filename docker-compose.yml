services:

  consul:
    image: hashicorp/consul:1.20
    container_name: consul
    ports:
      - "8500:8500"
    healthcheck:
      test: [ "CMD", "consul", "members" ]
      interval: 5s
      timeout: 3s
      retries: 5

  catalog-1:
    build: ./catalog_service
    container_name: catalog-1
    environment:
      INSTANCE_NAME: catalog-1
      PORT: 8000
      CONSUL_URL: http://consul:8500
    depends_on:
      consul:
        condition: service_healthy

  catalog-2:
    build: ./catalog_service
    container_name: catalog-2
    environment:
      INSTANCE_NAME: catalog-2
      PORT: 8000
      CONSUL_URL: http://consul:8500
    depends_on:
      consul:
        condition: service_healthy

  auth:
    build: ./auth_service
    container_name: auth
    ports:
      - "8000:8000"
    environment:
      PORT: 8000
      CONSUL_URL: http://consul:8500
    depends_on:
      consul:
        condition: service_healthy

  order:
    build: ./order_service
    container_name: order
    environment:
      RABBITMQ_URL: amqp://lab:lab@rabbitmq:5672/
      DATABASE_PATH: /data/orders.db
    ports:
      - "8003:8000"
    volumes:
      - order_data:/data
    depends_on:
      rabbitmq:
        condition: service_healthy

  graphql:
    build: ./graphql_gateway
    container_name: graphql
    environment:
      ORDER_URL: http://order:8000
      CATALOG_URL: http://catalog-1:8000
    depends_on:
      - order
      - catalog-1

  rabbitmq:
    image: rabbitmq:3-management
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: lab
      RABBITMQ_DEFAULT_PASS: lab
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  payment:
    build: ./payment_service
    environment:
      RABBITMQ_URL: amqp://lab:lab@rabbitmq:5672/
    depends_on:
      rabbitmq:
        condition: service_healthy

  notification:
    build: ./notification_service
    environment:
      RABBITMQ_URL: amqp://lab:lab@rabbitmq:5672/
    depends_on:
      rabbitmq:
        condition: service_healthy

  nginx:
    image: nginx:1.27
    container_name: nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - catalog-1
      - catalog-2
      - auth
      - order
      - graphql
volumes:
  rabbitmq_data:
  order_data: