"""Книга. Сведения загружаются из REST API Catalog."""
type Product {
    """Уникальный идентификатор книги."""
    id: ID!
    """Название книги."""
    name: String!
    """Текущая цена книги в рублях."""
    price: Float!
}

"""Позиция заказа: книга из Catalog и количество из Order."""
type OrderItem {
    """Сведения о книге, полученные отдельным запросом к Catalog."""
    product: Product!
    """Количество экземпляров в заказе."""
    quantity: Int!
}

"""Заказ пользователя, дополненный данными Catalog."""
type Order {
    """Идентификатор заказа."""
    id: ID!
    """Идентификатор пользователя, оформившего заказ."""
    userId: ID!
    """Дата создания в формате ISO 8601."""
    createdAt: String!
    """Позиции заказа с подробными сведениями о книгах."""
    items: [OrderItem!]!
}

"""Запросы к книжному магазину."""
type Query {
    """Заказы пользователя. Order и Catalog опрашиваются по HTTP; книги загружаются пакетом."""
    ordersByUserId(
        """Положительный ID пользователя. Для демонстрации: 1 или 2."""
        userId: ID!
    ): [Order!]!
}